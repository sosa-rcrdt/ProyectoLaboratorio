{% extends "base.html" %}

{% block title %}Menú principal{% endblock %}

{% block content %}

    <h1>Registrar nuevo material</h1>

    <a href="{{ url_for('menu') }}">Volver al menú</a>
    <br><br>

    {% if error %}
        <p id="errorBackendCrear" style="color:red;"><strong>{{ error }}</strong></p>
    {% endif %}

    

    <form method="POST" id="formCrearMaterial" novalidate>
        <div id="erroresCrear" style="color:red;"></div>
        <label for="numero_serie">Número de serie:</label><br>
        <input type="text" id="numero_serie" name="numero_serie" value="{{ datos.get('numero_serie', '') }}" required>
        <br><br>

        <label for="nombre_material">Nombre del material:</label><br>
        <input type="text" id="nombre_material" name="nombre_material" value="{{ datos.get('nombre_material', '') }}" required>
        <br><br>

        <label for="marca">Marca:</label><br>
        <input type="text" id="marca" name="marca" value="{{ datos.get('marca', '') }}" required>
        <br><br>

        <label for="doctor_responsable">Doctor responsable:</label><br>
        <input type="text" id="doctor_responsable" name="doctor_responsable" value="{{ datos.get('doctor_responsable', '') }}" required>
        <br><br>

        <label for="anio">Año:</label><br>
        <select id="anio" name="anio" required>
            <option value="">Selecciona un año</option>
            {% for anio in anios %}
                <option value="{{ anio }}" {% if datos.get('anio', '') == anio|string %}selected{% endif %}>
                    {{ anio }}
                </option>
            {% endfor %}
        </select>
        <br><br>

        <label for="ubicacion">Ubicación:</label><br>
        <input type="text" id="ubicacion" name="ubicacion" value="{{ datos.get('ubicacion', '') }}" required>
        <br><br>

        <label for="estado_prestamo">Estado del préstamo:</label><br>
        <select id="estado_prestamo" name="estado_prestamo" required>
            <option value="">Selecciona un estado</option>
            {% for estado in estados_validos %}
                <option value="{{ estado }}" {% if datos.get('estado_prestamo', '') == estado %}selected{% endif %}>
                    {{ estado }}
                </option>
            {% endfor %}
        </select>
        <br><br>

        <label for="foto">Ruta o URL de la foto (opcional):</label><br>
        <input type="text" id="foto" name="foto" value="{{ datos.get('foto', '') }}">
        <br><br>

        <label for="pdf_especificaciones">Ruta o URL del PDF (opcional):</label><br>
        <input type="text" id="pdf_especificaciones" name="pdf_especificaciones" value="{{ datos.get('pdf_especificaciones', '') }}">
        <br><br>

        <button type="submit">Guardar material</button>
    </form>

{% endblock %}
