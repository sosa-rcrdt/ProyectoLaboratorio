{% extends "base.html" %}

{% block title %}Registrar material{% endblock %}

{% block content %}
    <h1>Registrar nuevo material</h1>

    <form method="POST" enctype="multipart/form-data">
        <div>
            <label for="numero_serie">Número de serie:</label>
            <input type="text" id="numero_serie" name="numero_serie" required>
        </div>

        <br>

        <div>
            <label for="marca">Marca:</label>
            <input type="text" id="marca" name="marca" required>
        </div>

        <br>

        <div>
            <label for="doctor_responsable">Nombre del Dr. responsable:</label>
            <input type="text" id="doctor_responsable" name="doctor_responsable" required>
        </div>

        <br>

        <div>
            <label for="nombre_material">Nombre del material:</label>
            <input type="text" id="nombre_material" name="nombre_material" required>
        </div>

        <br>

        <div>
            <label for="anio">Año:</label>
            <input type="number" id="anio" name="anio" required>
        </div>

        <br>

        <div>
            <label for="ubicacion">Ubicación:</label>
            <input type="text" id="ubicacion" name="ubicacion" required>
        </div>

        <br>

        <div>
            <label for="estado_prestamo">Estado del préstamo:</label>
            <select id="estado_prestamo" name="estado_prestamo" required>
                <option value="Disponible">Disponible</option>
                <option value="En préstamo">En préstamo</option>
                <option value="Fuera de servicio">Fuera de servicio</option>
                <option value="En mantenimiento">En mantenimiento</option>
            </select>
        </div>

        <br>

        <div>
            <label for="foto">Foto:</label>
            <input type="file" id="foto" name="foto" accept="image/*">
        </div>

        <br>

        <div>
            <label for="pdf_especificaciones">PDF de especificaciones:</label>
            <input type="file" id="pdf_especificaciones" name="pdf_especificaciones" accept=".pdf,application/pdf">
        </div>

        <br>

        <button type="submit">Guardar material</button>
    </form>

    <br>
    <a href="{{ url_for('listar_materiales') }}">Volver a la lista</a>
{% endblock %}
